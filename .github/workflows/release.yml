name: Release (development → main)

on:
  pull_request:
    types:
      - closed
    branches:
      - development

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    name: Build, Testes e Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar projeto
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes de integração
        run: dotnet test --configuration Release --no-build --filter Category=Integration
        # Dica: adicione a categoria [TestCategory("Integration")] nos testes de integração.

      - name: Criar Release no GitHub
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-rc
          name: "Release RC ${{ github.run_number }}"
          body: |
            🚀 Release automática gerada após merge em **development**.
            - Build e testes concluídos com sucesso.
            - Ambiente: Homologação
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: true

      - name: Criar Pull Request para main
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'development';
            const base = 'main';
            const title = `Release: Merge development → main (${new Date().toISOString().split('T')[0]})`;
            const body = `Pull Request automática para promover código de *development* para *main* após release bem-sucedida.`;

            // Verifica se já existe PR aberta
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });

            if (prs.length > 0) {
              core.info(`PR já existente: ${prs[0].html_url}`);
            } else {
              const { data: newPR } = await github.rest.pulls.create({
                owner, repo, head, base, title, body
              });
              core.info(`✅ PR criada com sucesso: ${newPR.html_url}`);
            }
