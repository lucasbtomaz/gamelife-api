name: Validação contínua

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
      - 'feature/**'
      - 'feature-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-e-testar:
    name: Compilar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore GameLife.slnx

      - name: Compilar a solução
        run: dotnet build GameLife.slnx --configuration Release --no-restore

      - name: Executar os testes
        run: dotnet test GameLife.slnx --configuration Release --no-build --verbosity normal
